cargo-features = ["trim-paths"]

[package]
name = "fseec"
edition = "2024"
authors = ["XtrLumen"]

[dependencies]
clap = {
    version = "4.6.4",
    features = ["derive"]
}
libc = "1.0.0-alpha.4"
regex = "1.13.1"
anyhow = "1.0.104"
getrandom = "0.4.3"
libloading = "0.9.0"

[profile.release]
lto = true
strip = true
debug = false
panic = "abort"
opt-level = "z"
trim-paths = "all"
incremental = false
codegen-units = 1